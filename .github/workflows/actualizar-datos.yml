name: Actualizar datos de DigBin

# Corre dos veces por día (hora de Uruguay, UTC-3) y también se puede disparar
# a mano desde la pestaña "Actions" de GitHub. GitHub puede demorar unos minutos.
on:
  schedule:
    # 01:00 de Uruguay = 04:00 UTC — corrida principal (la lista de la mañana
    # no arrastra remates que cerraron la noche anterior).
    - cron: '0 4 * * *'
    # 18:00 de Uruguay = 21:00 UTC — segunda pasada para refrescar las ofertas
    # antes de que cierren los remates de esa noche.
    - cron: '0 21 * * *'
  workflow_dispatch: {}

# Necesario para poder commitear el JSON actualizado al repo.
permissions:
  contents: write

# Evita corridas superpuestas.
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repo
        uses: actions/checkout@v4
        with:
          # Historia completa: si al subir hay que rebasear sobre main (porque
          # otra corrida/otro push lo movió), git necesita la base común.
          fetch-depth: 0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Paso 1 — leer la home y armar candidatos
        run: node paso1_remates.js

      - name: Paso 2 — leer lotes y armar la lista de vinilos
        run: node paso2_vinilos.js

      - name: Copiar el resultado a la app
        run: cp vinilos-encontrados.json app/vinilos.json

      - name: Commitear y subir si hubo cambios
        # 'set -e' hace que si CUALQUIER comando falla (commit, push...), el paso
        # quede en ROJO. NO se esconden errores con 2>/dev/null ni con || true:
        # preferimos ver el error feo antes que un verde mentiroso.
        run: |
          set -e
          git config user.name "DigBin bot"
          git config user.email "actions@users.noreply.github.com"

          # El JSON de datos SIEMPRE se agrega: es el resultado que se publica.
          # (Si por algún motivo git add fallara, el paso se cae en rojo, no se
          #  oculta.)
          git add app/vinilos.json

          # El log de alertas es OPCIONAL: solo existe si hubo remates con
          # problemas. Que falte NO debe impedir publicar el JSON, por eso se
          # agrega SOLO si el archivo existe (y en su propio comando, no junto al
          # JSON: así una ruta faltante nunca aborta el git add del resultado).
          if [ -f alertas-remates.log ]; then
            git add alertas-remates.log
          fi

          if git diff --cached --quiet; then
            echo "Sin cambios — no hay nada para commitear."
          else
            git commit -m "Actualización automática de datos (vinilos.json) [skip ci]"

            # Publicar con reintentos. Si otro push movió main mientras corríamos
            # (ej: un merge), nuestro push se rechaza. En ese caso traemos main y
            # REBASEAMOS nuestro commit encima. Ante conflicto en app/vinilos.json
            # nos quedamos con el JSON RECIÉN GENERADO (el nuevo): en un rebase,
            # "-X theirs" = gana lo que estamos reaplicando, o sea nuestro commit.
            # (El rebase solo reaplica NUESTRO cambio: los cambios de main en
            #  otros archivos se conservan.)
            publicado=""
            for intento in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                publicado="si"; break
              fi
              echo "Push rechazado (intento $intento): traigo main y rebaseo..."
              git fetch origin main
              if ! git rebase -X theirs FETCH_HEAD; then
                # No se pudo rebasear limpio: no dejamos el repo a medias y
                # marcamos la corrida en ROJO (un fallo al publicar NO se oculta).
                git rebase --abort || true
                echo "::error::No se pudo rebasear sobre main tras un push rechazado."
                exit 1
              fi
              sleep $((intento * 3))
            done

            # Si tras todos los reintentos NO se pudo subir, la corrida queda en
            # ROJO. El rebase NO sirve para ocultar un fallo de push: si igual no
            # sube, se avisa fuerte.
            if [ -z "$publicado" ]; then
              echo "::error::No se pudo subir el JSON tras varios reintentos (main sigue moviéndose o hay un problema de push)."
              exit 1
            fi

            echo "Datos actualizados y subidos."
            # Verificación de guardado: confirmamos que lo que quedó en el árbol
            # de trabajo YA está commiteado. Si por lo que sea quedaran cambios
            # sin subir, el paso se pone en ROJO (un fallo al publicar NO puede
            # volver a ser invisible).
            if ! git diff --quiet -- app/vinilos.json; then
              echo "::error::app/vinilos.json quedó con cambios sin commitear tras el push."
              exit 1
            fi
            echo "Guardado verificado: app/vinilos.json commiteado y subido."
          fi

      # Marca la corrida en ROJO si algún remate no se pudo leer (aunque los
      # datos YA se publicaron con carry-forward). Así te enterás y podés revisar
      # el log alertas-remates.log.
      - name: Marcar la corrida si hubo remates con problemas
        run: |
          if [ -f .hubo-fallos ]; then
            echo "::warning::$(cat .hubo-fallos) remate(s) no se pudieron leer en esta corrida. Ver alertas-remates.log."
            echo "Hubo fallos de lectura; se publicaron los datos con carry-forward, pero marco la corrida para revisar."
            exit 1
          fi
          echo "Sin fallos de lectura en esta corrida."
