<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b5341f">
  <!-- No mandar Referer: el servidor de imágenes bloquea (403) las fotos
       pedidas desde otro dominio. Sin Referer, las devuelve (200). -->
  <meta name="referrer" content="no-referrer">
  <title>DigBin</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra superior -->
  <header class="appbar">
    <button id="btnMenu" class="btn-menu" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <button id="btnAtras" class="btn-atras" aria-label="Volver" hidden>‹</button>
    <h1 id="tituloBarra" class="appbar-titulo">DigBin</h1>
  </header>

  <main id="contenido">
    <!-- Acá se dibujan las pantallas con JavaScript -->
  </main>

  <div id="aviso" class="aviso" hidden></div>

  <!-- Menú lateral (se abre con la hamburguesa). Fondo oscuro + panel. -->
  <div id="drawerFondo" class="drawer-fondo" hidden></div>
  <nav id="drawer" class="drawer" aria-label="Menú" hidden>
    <div class="drawer-cabecera">DigBin</div>
    <button class="drawer-item" type="button" data-accion="remates">
      <span class="drawer-ico">💿</span> Remates
    </button>
    <button class="drawer-item" type="button" data-accion="coleccion">
      <span class="drawer-ico">♥</span> Colección
    </button>
    <button class="drawer-item" type="button" data-accion="recorrida">
      <span class="drawer-ico">🔄</span> Recorrida
      <span class="drawer-sub">actualizar ahora</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
