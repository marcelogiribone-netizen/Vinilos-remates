<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b5341f">
  <!-- No mandar Referer: el servidor de imágenes bloquea (403) las fotos
       pedidas desde otro dominio. Sin Referer, las devuelve (200). -->
  <meta name="referrer" content="no-referrer">
  <title>DigBin</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:#1a1618">
  <!-- Fondo inicial casi-negro (igual al splash) para que NO haya un parpadeo
       claro entre el splash del sistema y el de la app. app.js lo limpia (vuelve
       al tema) cuando cierra la pantalla de inicio. -->
  <!-- Barra superior -->
  <header class="appbar">
    <button id="btnMenu" class="btn-menu" aria-label="Menú" aria-expanded="false">
      <img class="btn-menu-ico" src="icons/logo-vinilo-512.png" alt="">
    </button>
    <button id="btnAtras" class="btn-atras" aria-label="Volver" hidden>‹</button>
    <h1 id="tituloBarra" class="appbar-titulo">DigBin</h1>
    <button id="btnMenuDetalle" class="btn-menu btn-menu-der" aria-label="Opciones del remate" aria-expanded="false" hidden>
      <img class="btn-menu-ico" src="icons/logo-vinilo-512.png" alt="">
    </button>
  </header>

  <main id="contenido">
    <!-- Acá se dibujan las pantallas con JavaScript -->
  </main>

  <div id="aviso" class="aviso" hidden></div>

  <!-- Fondo transparente para cerrar cualquier menú al tocar afuera. -->
  <div id="menuFondo" class="menu-fondo" hidden></div>

  <!-- Menú principal (baja desde el vinilo de la izquierda). -->
  <nav id="menuMain" class="menu-panel" aria-label="Menú" hidden>
    <button class="menu-item" type="button" data-accion="remates"><span class="menu-item-ico">💿</span> Remates</button>
    <button class="menu-item" type="button" data-accion="coleccion"><span class="menu-item-ico">♥</span> Colección</button>
    <button class="menu-item" type="button" data-accion="recorrida"><span class="menu-item-ico">🔄</span> Recorrida</button>
    <button class="menu-item" type="button" data-accion="backup"><span class="menu-item-ico">💾</span> Copia de seguridad</button>
  </nav>

  <!-- Menú del remate (baja desde el vinilo de la derecha; se arma al abrir). -->
  <nav id="menuDetalle" class="menu-panel menu-panel-der" aria-label="Opciones del remate" hidden></nav>

  <script src="app.js"></script>
</body>
</html>
