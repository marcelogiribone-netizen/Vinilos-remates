<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b5341f">
  <!-- No mandar Referer: el servidor de imágenes bloquea (403) las fotos
       pedidas desde otro dominio. Sin Referer, las devuelve (200). -->
  <meta name="referrer" content="no-referrer">
  <title>DigBin</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Barra superior -->
  <header class="appbar">
    <button id="btnAtras" class="btn-atras" aria-label="Volver" hidden>‹</button>
    <h1 id="tituloBarra" class="appbar-titulo">DigBin</h1>
  </header>

  <main id="contenido">
    <!-- Acá se dibujan las pantallas con JavaScript -->
  </main>

  <div id="aviso" class="aviso" hidden></div>

  <!-- Menú de navegación (pestañas de abajo) -->
  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button class="tab" type="button" data-hash="#/">
      <span class="tab-ico">💿</span>
      <span class="tab-txt">Remates</span>
    </button>
    <button class="tab" type="button" data-hash="#/coleccion">
      <span class="tab-ico">♥</span>
      <span class="tab-txt">Colección</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
